schema_version: 1

context:
  python_min: "3.10"
  name: parcels
  version: "3.1.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/oceanparcels/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: 0eee9745c3aca9b4b4399bb04705480964e9d4c5235f0d82ad251e7a560f7837

build:
  number: 1
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools_scm
    - setuptools_scm_git_archive
    - wheel
  run:
    - python >=${{ python_min }}
    - cftime
    - cgen
    - dask
    - if: unix
      then: __unix
    - if: win
      then: __win
    - if: unix
      then: c-compiler
    - if: win
      then: m2w64-toolchain
    - matplotlib-base >=2.0.2
    - netcdf4 >=1.1.9
    - numpy >=1.11
    - platformdirs
    - psutil
    - pymbolic
    - pytest
    - scipy >=0.16.0
    - trajan
    - tqdm
    - xarray >=0.10.8
    - zarr >=2.11.0,!=2.18.0,<3

tests:
  - python:
      imports:
        - parcels
      pip_check: false # TODO: Change to true once https://github.com/OpenDrift/trajan/pull/241 is merged, and trajan has new release
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - curl
        - python ${{ python_min }}.*
    script:
      - if: unix
        then: if [ -z ${CC+x} ]; then echo "\$CC not set"; exit 1; else echo "CC is set to $CC"; fi
      - curl https://raw.githubusercontent.com/OceanParcels/parcels/master/docs/examples/example_peninsula.py > example_peninsula.py
      - python example_peninsula.py

about:
  license: MIT
  license_file: LICENSE.md
  summary: Probably A Really Computationally Efficient Lagrangian Simulator
  description: |
    Parcels (Probably A Really Computationally Efficient Lagrangian Simulator)
    is a set of Python classes and methods to create customisable particle
    tracking simulations using output from Ocean Circulation models.
    Parcels can be used to track passive and active particulates such as
    water, nutrients, plankton, plastic and fish.
  homepage: https://github.com/OceanParcels/parcels
  repository: https://github.com/OceanParcels/parcels
  documentation: https://oceanparcels.org/

extra:
  recipe-maintainers:
    - VeckoTheGecko
    - erikvansebille
    - willirath
